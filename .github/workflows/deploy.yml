name: WorkHub CD Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS Lightsail Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.179.236.212
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.PRIVATE_KEY || secrets.LIGHTSAIL_KEY || secrets.LIGHTSAIL_SSH_KEY || secrets.AWS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Deployment started on $(hostname) at $(date)"
            
            # Ensure full PATH access for node, pnpm, and pm2 in non-interactive SSH
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/share/pnpm:$HOME/.npm-global/bin:$PATH"
            export NODE_ENV=production
            
            # Navigate to project directory
            cd /home/ubuntu/work_hub || exit 1

            # Pull latest changes from main branch
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies
            echo "📦 Installing dependencies..."
            pnpm install --frozen-lockfile=false

            # Sync environment files
            cp -f .env packages/database/.env 2>/dev/null || true
            cp -f .env apps/api/.env 2>/dev/null || true

            # Generate Prisma client and sync database
            echo "🗄️ Running database sync..."
            cd packages/database && npx prisma generate && npx prisma db push && cd /home/ubuntu/work_hub

            # Build production Next.js and NestJS packages
            echo "🔨 Building application for production..."
            pnpm build

            # Zero-downtime reload via PM2
            echo "🔄 Restarting application services..."
            pm2 reload workhub-api || pm2 start "pnpm --filter @workhub/api start:prod" --name "workhub-api"
            pm2 reload workhub-web || pm2 start "pnpm --filter @workhub/web start" --name "workhub-web"
            pm2 save

            echo "✅ Deployment completed successfully at $(date)!"
