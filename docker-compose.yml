services:
  postgres:
    image: postgres:16-alpine
    container_name: workhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: workhub_local_password
    ports:
      - "5432:5432"
    volumes:
      - workhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub -d workhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: workhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - workhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: workhub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workhub_local
      MINIO_ROOT_PASSWORD: change_me_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - workhub_minio_data:/data

volumes:
  workhub_postgres_data:
  workhub_redis_data:
  workhub_minio_data:
